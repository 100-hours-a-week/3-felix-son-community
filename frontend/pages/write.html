<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - 커뮤니티</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- 네비게이션 바 -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1><a href="../index.html">My Community</a></h1>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">홈</a></li>
                <li><a href="post-list.html">게시글</a></li>
                <li id="authNav">
                    <!-- 로그인/로그아웃 버튼이 동적으로 표시됩니다 -->
                </li>
            </ul>
        </div>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-content">
        <div class="container">
            <div class="write-container">
                <h2 id="pageTitle">게시글 작성</h2>
                <form id="writeForm" class="write-form">
                    <div class="form-group">
                        <label for="postTitle">제목</label>
                        <input type="text" id="postTitle" required placeholder="제목을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label for="postContent">내용</label>
                        <textarea id="postContent" rows="10" required placeholder="내용을 입력하세요"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="postImages">이미지 URL (선택사항)</label>
                        <textarea id="postImages" rows="3" placeholder="이미지 URL을 입력하세요 (한 줄에 하나씩)&#10;예시:&#10;https://example.com/image1.jpg&#10;https://example.com/image2.jpg"></textarea>
                        <small style="color: #666; margin-top: 0.5rem; display: block;">
                            * 여러 이미지를 추가하려면 한 줄에 하나씩 입력하세요
                        </small>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">등록</button>
                        <button type="button" class="btn btn-secondary" onclick="goBack()">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- JavaScript 파일들 -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        let editMode = false;
        let editPostId = null;
        let originalPost = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // 네비게이션 업데이트
            authManager.updateUI();

            // 로그인 확인
            if (!authManager.isLoggedIn()) {
                showError('로그인이 필요합니다.');
                window.location.href = 'login.html';
                return;
            }

            // URL에서 postId 확인 (수정 모드인지 확인)
            const urlParams = new URLSearchParams(window.location.search);
            editPostId = urlParams.get('id');

            if (editPostId) {
                // 수정 모드
                editMode = true;
                document.getElementById('pageTitle').textContent = '게시글 수정';
                document.getElementById('submitBtn').textContent = '수정';
                
                // 기존 게시글 데이터 로드
                await loadPostForEdit(editPostId);
            }

            // 폼 제출 이벤트
            setupForm();
        });

        async function loadPostForEdit(postId) {
            try {
                const post = await api.getPost(postId);
                originalPost = post;
                
                // 작성자 확인
                const currentUser = authManager.getCurrentUser();
                const isAuthor = currentUser && 
                    (currentUser.userId === post.user.userId || 
                     currentUser.nickname === post.user.nickname);
                
                if (!isAuthor) {
                    showError('게시글 작성자만 수정할 수 있습니다.');
                    window.location.href = `post-detail.html?id=${postId}`;
                    return;
                }
                
                // 폼에 데이터 채우기
                document.getElementById('postTitle').value = post.title;
                document.getElementById('postContent').value = post.body;
                
                // 이미지 URL 채우기
                if (post.images && post.images.length > 0) {
                    const imageUrls = post.images.map(img => img.imageUrl).join('\n');
                    document.getElementById('postImages').value = imageUrls;
                }
                
            } catch (error) {
                console.error('게시글 로드 실패:', error);
                showError('게시글을 불러오는데 실패했습니다.');
                window.location.href = 'post-list.html';
            }
        }

        function setupForm() {
            const writeForm = document.getElementById('writeForm');
            writeForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const title = document.getElementById('postTitle').value.trim();
                const body = document.getElementById('postContent').value.trim();
                const imagesText = document.getElementById('postImages').value.trim();

                if (!title || !body) {
                    showError('제목과 내용을 모두 입력해주세요.');
                    return;
                }

                // 이미지 URL 처리
                const imageUrls = imagesText
                    .split('\n')
                    .map(url => url.trim())
                    .filter(url => url.length > 0);

                try {
                    if (editMode) {
                        // 수정 모드
                        console.log('게시글 수정:', { postId: editPostId, title, body, imageUrls });
                        await api.updatePost(editPostId, title, body, imageUrls);
                        showSuccess('게시글이 수정되었습니다.');
                        
                        // 상세 페이지로 이동
                        setTimeout(() => {
                            window.location.href = `post-detail.html?id=${editPostId}`;
                        }, 1000);
                    } else {
                        // 작성 모드
                        console.log('게시글 작성:', { title, body, imageUrls });
                        await api.createPost(title, body, imageUrls);
                        showSuccess('게시글이 작성되었습니다.');
                        
                        // 목록으로 이동
                        setTimeout(() => {
                            window.location.href = 'post-list.html';
                        }, 1000);
                    }
                } catch (error) {
                    console.error('게시글 처리 실패:', error);
                    showError(error.message || '게시글 처리에 실패했습니다.');
                }
            });
        }

        function goBack() {
            if (editMode && editPostId) {
                window.location.href = `post-detail.html?id=${editPostId}`;
            } else {
                window.location.href = 'post-list.html';
            }
        }
    </script>
</body>
</html>
